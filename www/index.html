 const L=$('cl');L.innerHTML='';[...CARDS].sort(()=>Math.random()-.5).slice(0,3).forEach(c=>{const b=document.createElement('button');b.className='b c';b.style.minHeight='84px';b.textContent=c[0];b.onclick=()=>{c[1]();st='play';show(null)};L.appendChild(b)});show('lv')}
// ---------- Kontroller ----------
cv.addEventListener('pointerdown',e=>{snd(440,.02,'sine',.005);if(st!='play'||joy||e.clientY<H*.15)return;joy={id:e.pointerId,ox:e.clientX,oy:e.clientY,x:e.clientX,y:e.clientY};try{cv.setPointerCapture(e.pointerId)}catch(_){}e.preventDefault()});
cv.addEventListener('pointermove',e=>{if(joy&&e.pointerId==joy.id){joy.x=e.clientX;joy.y=e.clientY}});
const pu=e=>{if(joy&&e.pointerId==joy.id)joy=null};cv.addEventListener('pointerup',pu);cv.addEventListener('pointercancel',pu);
document.addEventListener('contextmenu',e=>e.preventDefault());
// ---------- Ateş ----------
function fire(tg){const t=tier(),a0=Math.atan2(tg.y-P.y,tg.x-P.x);P.a=a0;if(Math.abs(Math.cos(a0))>.2)P.face=Math.cos(a0)<0?-1:1;
 let n=P.multi+(t==1?1:0)+(t==2?2:0);const sp=t==2?.5:.13,vm=t==3?1.4:1;
 for(let i=0;i<n;i++){const a=a0+(n>1?(i-(n-1)/2)*sp:0);
  B.push({x:P.x,y:P.y,vx:Math.cos(a)*P.bs*vm,vy:Math.sin(a)*P.bs*vm,d:P.dmg*(t==3?.6:t==2?1.2:1),r:t==2?8:t==1?5:4,pi:P.pierce+(t==3?99:0),bo:P.bounce,h:[],life:t==2?.55:1.3,c:TC[t]})}
 snd(t==3?900:450+t*90,.06,'square',.025,200)}
// ---------- Güncelleme ----------
function update(dt){
 if(ban>0)ban-=dt;
 if(P.inv>0)P.inv-=dt;
 P.mv=0;
 if(joy){const dx=joy.x-joy.ox,dy=joy.y-joy.oy,l=Math.hypot(dx,dy);if(l>4){P.mv=1;P.an+=dt;if(Math.abs(dx)>8)P.face=dx<0?-1:1;const m=Math.min(l,60)/60;P.x+=dx/l*m*P.sp*dt;P.y+=dy/l*m*P.sp*dt}}
 P.x=Math.max(P.r,Math.min(W-P.r,P.x));P.y=Math.max(P.r+40,Math.min(H-P.r,P.y));
 // otomatik nişan
 let tg=null,bd=380;for(const e of E){const d=Math.hypot(e.x-P.x,e.y-P.y);if(d<bd){bd=d;tg=e}}
 P.fire-=dt;if(tg&&P.fire<=0){fire(tg);P.fire=1/(P.rate*(tier()==3?1.8:1))}
 // spawn
 spawnT-=dt;if(spawnLeft>0&&spawnT<=0){spawn();spawnT=boss?Math.max(.3,1-wave*.03):Math.max(.2,1.0-wave*.04)}
 if(spawnLeft<=0&&!E.length&&ban<=0){nextWave()}
 // mermiler
 for(const b of B){b.x+=b.vx*dt;b.y+=b.vy*dt;b.life-=dt;if(b.life<=0||b.x<-30||b.x>W+30||b.y<-30||b.y>H+30){b.dead=1;continue}
  for(const e of E){if(e.dead||b.h.includes(e))continue;if(Math.hypot(e.x-b.x,e.y-b.y)<e.r+b.r){b.h.push(e);hurtE(e,b.d);
   if(b.pi>0)b.pi--;else if(b.bo>0){b.bo--;let n=null,nd=450;for(const o of E){if(o.dead||b.h.includes(o))continue;const d=Math.hypot(o.x-b.x,o.y-b.y);if(d<nd){nd=d;n=o}}
    if(n){const a=Math.atan2(n.y-b.y,n.x-b.x),s=Math.hypot(b.vx,b.vy);b.vx=Math.cos(a)*s;b.vy=Math.sin(a)*s}else b.dead=1}else b.dead=1;break}}}
 // düşmanlar
 for(const e of E){if(e.dead)continue;e.hit>0&&(e.hit-=dt);const dx=P.x-e.x,dy=P.y-e.y,d=Math.hypot(dx,dy)||1;
  e.fx=dx<0?-1:1;if(e.rg){if(d>230){e.x+=dx/d*e.sp*dt;e.y+=dy/d*e.sp*dt}e.sh-=dt;if(e.sh<=0){e.sh=2;for(let i=0;i<e.rg;i++){const a=Math.atan2(dy,dx)+(i-(e.rg-1)/2)*.3;EB.push({x:e.x,y:e.y,vx:Math.cos(a)*210,vy:Math.sin(a)*210,d:e.dmg,r:6})}}}
  else{e.x+=dx/d*e.sp*dt;e.y+=dy/d*e.sp*dt}
  if(e.boss){e.sh-=dt;if(e.sh<=0){e.sh=2.3;const n=10+Math.min(wave,10);for(let i=0;i<n;i++){const a=i/n*6.283+Math.random();EB.push({x:e.x,y:e.y,vx:Math.cos(a)*170,vy:Math.sin(a)*170,d:e.dmg*.5,r:7})}snd(150,.3,'sawtooth',.05,60)}}
  if(d<e.r+P.r)hurtP(e.dmg)}
 for(const b of EB){b.x+=b.vx*dt;b.y+=b.vy*dt;if(b.x<-30||b.x>W+30||b.y<-30||b.y>H+30)b.dead=1;else if(Math.hypot(b.x-P.x,b.y-P.y)<b.r+P.r){b.dead=1;hurtP(b.d)}}
 // toplanabilirler
 for(const a of [G,C])for(const o of a){const dx=P.x-o.x,dy=P.y-o.y,d=Math.hypot(dx,dy)||1;
  if(d<P.mag||o.m){o.m=1;const s=380+o.t*0;o.x+=dx/d*s*dt;o.y+=dy/d*s*dt}
  if(d<P.r+8){o.dead=1;if(a===G){P.xp+=o.v;snd(900,.05,'sine',.03)}else{run.gold+=o.v;snd(1200,.05,'triangle',.03)}}}
 if(P.xp>=P.need){P.xp-=P.need;P.need=Math.round(P.need*1.35+2);P.lv++;levelUp()}
 for(const p of Pt){p.x+=p.vx*dt;p.y+=p.vy*dt;p.t-=dt}
 for(const t of T){t.y-=40*dt;t.t-=dt}
 shake*=.88;
 E=E.filter(e=>!e.dead);B=B.filter(b=>!b.dead);EB=EB.filter(b=>!b.dead);G=G.filter(o=>!o.dead);C=C.filter(o=>!o.dead);Pt=Pt.filter(p=>p.t>0);T=T.filter(t=>t.t>0)}
// ---------- Çizim ----------
function circ(x,y,r,c){g.fillStyle=c;g.beginPath();g.arc(x,y,r,0,6.283);g.fill()}
function draw(){
 g.save();g.fillStyle='#05060f';g.fillRect(0,0,W,H);
 if(st=='play'||st=='lv'||st=='over'){if(shake>.5)g.translate((Math.random()-.5)*shake,(Math.random()-.5)*shake)}
 g.strokeStyle='rgba(0,255,255,.06)';g.lineWidth=1;g.beginPath();for(let x=0;x<W;x+=40){g.moveTo(x,0);g.lineTo(x,H)}for(let y=0;y<H;y+=40){g.moveTo(0,y);g.lineTo(W,y)}g.stroke();
 if(!P||st=='menu'){g.restore();return}
 for(const o of G)circ(o.x,o.y,5,'#4af');
 for(const o of C)circ(o.x,o.y,6,'#fd0');
 for(const e of E){const m=ZM[e.k],dh=e.r*3.1,dw=dh*m[2]/m[3],tm=performance.now()/1000,wh=e.hit>0&&ZW[e.k],fy=e.y+e.r*.85;
  g.fillStyle='rgba(0,0,0,.35)';g.beginPath();g.ellipse(e.x,fy,e.r*.9,e.r*.3,0,0,6.283);g.fill();
  g.save();g.translate(e.x,fy);g.rotate(Math.sin(tm*7+e.ph)*.05);g.translate(0,-Math.abs(Math.sin(tm*7+e.ph))*3);g.scale(e.fx,1);g.imageSmoothingEnabled=false;
  if(ZI.complete&&ZI.naturalWidth){if(wh)g.drawImage(ZW[e.k],-dw/2,-dh,dw,dh);else g.drawImage(ZI,m[0],m[1],m[2],m[3],-dw/2,-dh,dw,dh)}else circ(0,-e.r,e.r,'#6c3');
  g.restore();
  if(e.mhp>100){const by=fy-dh-8;g.fillStyle='#300';g.fillRect(e.x-e.r,by,e.r*2,4);g.fillStyle='#f55';g.fillRect(e.x-e.r,by,e.r*2*Math.max(0,e.hp/e.mhp),4)}}
 g.shadowBlur=8;g.lineCap='round';
 for(const b of B){g.shadowColor=b.c;g.strokeStyle=b.c;g.lineWidth=b.r*1.6;g.beginPath();g.moveTo(b.x,b.y);g.lineTo(b.x-b.vx*.04,b.y-b.vy*.04);g.stroke()}
 for(const b of EB){g.shadowColor='#f35';circ(b.x,b.y,b.r,'#f35')}
 g.shadowBlur=0;
 for(const p of Pt){g.globalAlpha=Math.max(0,p.t*2);circ(p.x,p.y,3,p.c)}g.globalAlpha=1;
 // oyuncu
 const th=TC[tier()],ph=58,pw2=ph*SFW/SFH,fr=P.mv?1+((P.an*10)|0)%5:0;
 g.save();g.translate(P.x,P.y);
 g.globalAlpha=.5;g.shadowColor=th;g.shadowBlur=12;g.strokeStyle=th;g.lineWidth=3;g.beginPath();g.ellipse(0,P.r+2,P.r+8,6,0,0,6.283);g.stroke();g.shadowBlur=0;g.globalAlpha=1;
 if(P.inv>0&&((P.inv*20)|0)%2)g.globalAlpha=.4;
 g.scale(P.face,1);g.imageSmoothingEnabled=false;
 if(SPR.complete&&SPR.naturalWidth)g.drawImage(SPR,fr*SFW,0,SFW,SFH,-pw2/2,P.r+4-ph,pw2,ph);else circ(0,0,P.r,th);
 g.restore();
 // hasar yazıları
 g.font='bold 16px system-ui';g.textAlign='center';for(const t of T){g.globalAlpha=Math.min(1,t.t*2);g.fillStyle=t.c;g.fillText(t.s,t.x,t.y)}g.globalAlpha=1;
 // joystick
 if(joy){const dx=joy.x-joy.ox,dy=joy.y-joy.oy,l=Math.hypot(dx,dy),k=l>60?60/l:1;g.strokeStyle='rgba(255,255,255,.25)';g.lineWidth=3;g.beginPath();g.arc(joy.ox,joy.oy,60,0,6.283);g.stroke();circ(joy.ox+dx*k,joy.oy+dy*k,26,'rgba(255,255,255,.25)')}
 g.restore();
 // HUD
 const pw=W-20;g.fillStyle='#222';g.fillRect(10,10,pw,12);g.fillStyle='#f33';g.fillRect(10,10,pw*Math.max(0,P.hp/P.mhp),12);
 g.fillStyle='#123';g.fillRect(10,26,pw,8);g.fillStyle='#4af';g.fillRect(10,26,pw*Math.min(1,P.xp/P.need),8);
 g.font='bold 16px system-ui';g.textAlign='left';g.fillStyle='#fff';g.fillText('Dalga '+wave+'  Sv.'+P.lv,10,56);g.textAlign='right';g.fillStyle='#fd0';g.fillText('◉ '+run.gold,W-10,56);
 const bs=E.find(e=>e.boss);if(bs){g.fillStyle='#300';g.fillRect(20,68,W-40,16);g.fillStyle='#f0a';g.fillRect(20,68,(W-40)*Math.max(0,bs.hp/bs.mhp),16);g.strokeStyle='#fff';g.lineWidth=2;g.strokeRect(20,68,W-40,16);g.textAlign='center';g.fillStyle='#fff';g.font='bold 12px system-ui';g.fillText('BOSS',W/2,80)}
 if(ban>0&&st=='play'){g.globalAlpha=Math.min(1,ban);g.textAlign='center';g.font='bold 40px system-ui';g.fillStyle=boss?'#f0a':'#0ff';g.fillText(boss?'BOSS DALGASI '+wave:'DALGA '+wave,W/2,H*.35);g.globalAlpha=1}
}
let last=performance.now();
function loop(t){const dt=Math.min((t-last)/1000,.05);last=t;if(st=='play')update(dt);draw();requestAnimationFrame(loop)}
menu();requestAnimationFrame(loop);
</script></body></html>
